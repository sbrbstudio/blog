<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title">
  <title id="title">Five-step website editing workflow</title>
  <rect width="1200" height="500" fill="#F7F7F5"/>
  <path d="M126 250H1074" stroke="#D8D8D3" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <g>
      <circle cx="126" cy="250" r="42" fill="#191919"/>
      <text x="126" y="258" fill="#FFFFFF" font-size="18" text-anchor="middle">01</text>
      <text x="126" y="330" fill="#191919" font-size="18" text-anchor="middle">Content</text>
      <text x="126" y="356" fill="#777777" font-size="13" text-anchor="middle">Model</text>
    </g>
    <g>
      <circle cx="363" cy="250" r="42" fill="#191919"/>
      <text x="363" y="258" fill="#FFFFFF" font-size="18" text-anchor="middle">02</text>
      <text x="363" y="330" fill="#191919" font-size="18" text-anchor="middle">Design</text>
      <text x="363" y="356" fill="#777777" font-size="13" text-anchor="middle">System</text>
    </g>
    <g>
      <circle cx="600" cy="250" r="42" fill="#3366CC"/>
      <text x="600" y="258" fill="#FFFFFF" font-size="18" text-anchor="middle">03</text>
      <text x="600" y="330" fill="#191919" font-size="18" text-anchor="middle">Build</text>
      <text x="600" y="356" fill="#777777" font-size="13" text-anchor="middle">Interactions</text>
    </g>
    <g>
      <circle cx="837" cy="250" r="42" fill="#191919"/>
      <text x="837" y="258" fill="#FFFFFF" font-size="18" text-anchor="middle">04</text>
      <text x="837" y="330" fill="#191919" font-size="18" text-anchor="middle">Validate</text>
      <text x="837" y="356" fill="#777777" font-size="13" text-anchor="middle">SEO / A11y</text>
    </g>
    <g>
      <circle cx="1074" cy="250" r="42" fill="#191919"/>
      <text x="1074" y="258" fill="#FFFFFF" font-size="18" text-anchor="middle">05</text>
      <text x="1074" y="330" fill="#191919" font-size="18" text-anchor="middle">Publish</text>
      <text x="1074" y="356" fill="#777777" font-size="13" text-anchor="middle">Maintain</text>
    </g>
  </g>
  <text x="60" y="60" fill="#777777" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">ONE CONTINUOUS EDITING SYSTEM</text>
